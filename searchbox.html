<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<title>Sitelinks SearchBox - Locanda del Contadino</title>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://sites.google.com/view/locandadelcontadino#website",
  "name": "Locanda del Contadino",
  "url": "https://sites.google.com/view/locandadelcontadino",
  "inLanguage": "it-IT",
  "publisher": {
    "@type": "Organization",
    "@id": "https://sites.google.com/view/locandadelcontadino#organization"
  },
  "potentialAction": [
    {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://sites.google.com/view/locandadelcontadino/pizza-delivery-cremona?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    },
    {
      "@type": "OrderAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://sites.google.com/view/locandadelcontadino/pizza-delivery-cremona",
        "actionPlatform": [
          "http://schema.org/DesktopWebPlatform",
          "http://schema.org/MobileWebPlatform"
        ]
      },
      "name": "Ordina pizza a domicilio"
    }
  ]
}
</script>
</head>
<body></body>
</html>
